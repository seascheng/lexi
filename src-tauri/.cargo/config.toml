# Xcode 27 toolchain workaround (2026-09-15, root-caused 2026-09-17):
# Xcode 27's SDK ships reworked .tbd files that make its ld (27037.1, same
# version in Xcode and CLT) emit proc-macro dylibs with a 4-byte-aligned
# LINKEDIT string table — dyld rejects them ("mis-aligned LINKEDIT string
# pool") and sqlx-macros dies. Linking against the CLT 26.5 SDK instead
# produces clean dylibs.
# History: the 2026-09-15 version also set RUSTFLAGS under [env], which cargo
# never consults for link flags, so only the SDKROOT half was ever active.
# Verified combos (cargo build --release -p sqlx-macros + dlopen check):
#   Xcode 27 SDK                      -> mis-aligned, deterministic
#   CLT 26.5 SDK                      -> OK  (this config)
# Remove after a fixed Xcode ships.
[env]
SDKROOT = "/Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk"
