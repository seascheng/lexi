name: Lexi
options:
  bundleIdPrefix: com.lexi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Same identity build.rs signs the helper with — the Accessibility and
    # folder TCC grants must survive the cutover rebuild.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: chengweipeng123@163.com (D8YJ3P5B53)"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Lexi:
    type: application
    platform: macOS
    sources:
      # Every file build.rs feeds swiftc today, minus the generated app
      # bundle itself. main.swift keeps its top-level entry point.
      - path: SelectionToolbarHelper.swift
      - path: LauncherPanel.swift
      - path: PanelDesign.swift
      - path: ClipboardStore.swift
      - path: ClipboardMonitor.swift
      - path: ClipboardPanel.swift
      - path: LexiStore.swift
      - path: SettingsWindow.swift
      - path: SettingsPanes.swift
      - path: AIService.swift
      - path: SM2.swift
      - path: StudyPanes.swift
      - path: ContentPanes.swift
      - path: SurfacePanes.swift
      - path: ShortcutMonitor.swift
      - path: SelectionPipeline.swift
      - path: main.swift
    settings:
      base:
        PRODUCT_NAME: Lexi
        # The helper's bundle id changes to the main identity: LexiStore's
        # hardcoded com.lexi.app app-support path then matches the natural
        # derivation — the shared lexi.db keeps working untouched.
        PRODUCT_BUNDLE_IDENTIFIER: com.lexi.app
        INFOPLIST_FILE: LexiAppInfo.plist
        # No sandbox: AX reading, session event taps and pasteboard leases
        # all require unfettered process access (same as today's helper).
        ENABLE_APP_SANDBOX: NO
        OTHER_LDFLAGS:
          - "-lsqlite3"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
    dependencies:
      - sdk: AppKit.framework
      - sdk: ApplicationServices.framework
      - sdk: Foundation.framework
      - sdk: Network.framework
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
